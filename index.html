<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI GUSTAVE</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:white;display:flex;flex-direction:column;height:100vh;}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #eee;background:white;position:sticky;top:0;z-index:10;}
.menu{font-size:26px;}
.titre{text-align:center;flex:1;}
.titre b{font-size:18px;display:block;}
.titre span{font-size:13px;color:#888;}
.icones-top{display:flex;gap:18px;font-size:22px;}
.icones-top span{cursor:pointer;}
.chat{flex:1;overflow-y:auto;padding:15px;background:#f9f9f9;}
.msg{background:white;padding:14px;border-radius:12px;margin-bottom:12px;font-size:17px;line-height:1.5;white-space:pre-wrap;box-shadow:0 1px 2px #ddd;}
.user-msg{background:#d1ffd1;text-align:right;}
.motivation{background:#fff3cd;padding:10px;border-radius:10px;margin-top:8px;font-size:15px;}
.couper{display:none;background:#ff3b30;color:white;text-align:center;padding:14px;font-weight:bold;cursor:pointer;font-size:17px;}
.reprendre{display:none;background:#fff3cd;padding:12px;text-align:center;}
.reprendre button{padding:10px 15px;margin:5px;border:none;border-radius:10px;background:#1e88e5;color:white;}
.photo-zone{text-align:center;padding:10px;}
.photo-zone img{max-width:100%;border-radius:12px;margin-top:10px;}
.habit-btn{padding:8px 10px;margin:3px;border:none;background:#1e88e5;color:white;border-radius:20px;font-size:12px;}
.bas{background:white;padding:10px 10px 15px;border-top:1px solid #eee;}
.barre-bas{display:flex;align-items:center;gap:8px;background:white;border:2px solid #1e88e5;border-radius:30px;padding:8px 12px;}
.barre-bas input{flex:1;border:none;outline:none;font-size:17px;padding:8px 0;}
.icone-bas{font-size:26px;cursor:pointer;}
.btn-envoyer{background:#1e88e5;color:white;border:none;border-radius:50%;width:42px;height:42px;font-size:20px;}
.del{width:100%;padding:8px;background:#ff9800;color:white;border:none;border-radius:10px;margin-top:8px;}
.etat-appel{text-align:center;font-size:14px;color:#25D366;font-weight:bold;padding:4px;}
</style>
</head>
<body>

<div class="top">
<div class="menu" onclick="ouvrirMenu()">☰</div>
<div class="titre"><b>AI GUSTAVE</b><span>Généré par l'IA</span></div>
<div class="icones-top">
<span onclick="appeler()">📞</span>
<span onclick="lireDernier()">🔊</span>
</div>
</div>

<div class="etat-appel" id="etatAppel"></div>
<div class="couper" id="couperBtn" onclick="arreterAppel()">📞✂️ COUPER L'APPEL - Si tu es fatigué, appuie ici</div>

<div class="reprendre" id="reprendreZone">
<b>Tu veux qu'on revienne à la discussion là ?</b><br>
<button onclick="reprendreOui()">Oui, on continue là</button>
<button onclick="reprendreNon()" style="background:#ff9800;">Non, on recommence</button>
</div>

<div class="chat" id="chat">
<div class="msg">Salut ! Je suis <b>AI GUSTAVE</b>. Écris en bas, envoie une photo, ou appelle-moi en haut à droite.</div>
</div>

<div class="photo-zone" id="photoZone" style="display:none;">
<img id="photoAffichee">
<div id="habits" style="display:none;">
<br>
<button class="habit-btn" onclick="habiller('Costume noir')">👔 Costume noir</button>
<button class="habit-btn" onclick="habiller('Chemise blanche')">Chemise blanche</button>
<button class="habit-btn" onclick="habiller('Robe rouge')">👗 Robe rouge</button>
<button class="habit-btn" onclick="habiller('Boubou africain')">🧕 Boubou</button>
<br><br>
<button onclick="telechargerPhoto()" style="padding:10px;border-radius:10px;background:#1e88e5;color:white;border:none;">Télécharger la photo</button>
</div>
</div>

<div class="bas">
<div class="barre-bas">
<span class="icone-bas" onclick="document.getElementById('photoInput').click()">📷</span>
<input type="file" id="photoInput" accept="image/*" onchange="chargerPhoto(event)" style="display:none;">
<input type="text" id="question" placeholder="Message..." onkeydown="if(event.key==='Enter') envoyer()">
<span class="icone-bas" onclick="appeler()">🎤</span>
<span class="icone-bas" onclick="ouvrirPlus()">➕</span>
<button class="btn-envoyer" onclick="envoyer()">➤</button>
</div>
<button class="del" onclick="supprimerDiscussion()">🗑 Supprimer la discussion et recommencer</button>
<div id="menuPlus" style="display:none;text-align:center;padding-top:8px;">
<button class="habit-btn" onclick="partager()">Partager sur WhatsApp</button>
<button class="habit-btn" onclick="copier()">Copier</button>
<button class="habit-btn" onclick="document.getElementById('photoInput').click()">📸 Envoyer une photo</button>
</div>
</div>

<script>
let photoOriginale = null;
let enAppel = false;
let recognition = null;
let dernierTexte = "";
let enTrainDeParler = false;

function ouvrirMenu(){ alert("AI GUSTAVE - Tu peux écrire, envoyer une photo, appeler, ou supprimer la discussion."); }
function ouvrirPlus(){ let m=document.getElementById("menuPlus"); m.style.display = m.style.display=="none" ? "block" : "none"; }
function sauvegarder(){ try{ localStorage.setItem("chat_gustave", document.getElementById("chat").innerHTML); }catch(e){} }
function chargerDiscussion(){
  try{
    let ancien = localStorage.getItem("chat_gustave");
    if(ancien && ancien.length > 200){
      document.getElementById("reprendreZone").style.display="block";
      window.ancienChat = ancien;
    }
  }catch(e){}
}
function reprendreOui(){
  document.getElementById("reprendreZone").style.display="none";
  document.getElementById("chat").innerHTML = window.ancienChat;
  document.getElementById("chat").innerHTML += '<div class="msg">Oui, on revient à la discussion là. On continue où on s\'était arrêté.<div class="motivation">👋 Content de te revoir ! On continue ensemble. 💪</div></div>';
  sauvegarder();
}
function reprendreNon(){
  document.getElementById("reprendreZone").style.display="none";
  try{ localStorage.removeItem("chat_gustave"); }catch(e){}
  document.getElementById("chat").innerHTML='<div class="msg">D\'accord, on recommence une nouvelle discussion.</div>';
  sauvegarder();
}
function supprimerDiscussion(){
  if(confirm("Tu veux vraiment supprimer toute la discussion et recommencer ?")){
    try{ localStorage.removeItem("chat_gustave"); }catch(e){}
    document.getElementById("chat").innerHTML='<div class="msg">Discussion supprimée. On recommence.</div>';
    sauvegarder();
  }
}
window.onload = function(){ chargerDiscussion(); };

function envoyer(){
  let q=document.getElementById("question").value.trim();
  if(q=="") return;
  traiterQuestion(q,true);
  document.getElementById("question").value="";
}
function traiterQuestion(q, ecrire){
  let chat=document.getElementById("chat");
  if(ecrire) chat.innerHTML += '<div class="msg user-msg">'+q+'</div>';
  let rep = repondreIntelligent(q);
  dernierTexte = rep;
  chat.innerHTML += '<div class="msg">'+rep+'<div class="motivation">'+motivation()+'</div></div>';
  chat.scrollTop = chat.scrollHeight;
  sauvegarder();
  let p=q.toLowerCase();
  if(p.includes("squelette") || p.includes("transforme")){ if(photoOriginale) genererSquelette(); }
  if(p.includes("habille")){ if(photoOriginale) habiller('Costume noir'); }
  // ★ SI LA PERSONNE DIT QU'ELLE EST FATIGUÉE PENDANT L'APPEL ★
  if(enAppel && (p.includes("fatigué") || p.includes("fatigue") || p.includes("je suis fatigué") || p.includes("arrêter") || p.includes("couper"))){
    // On ne coupe pas tout seul, on lui demande
    setTimeout(function(){
      parler("Je comprends, tu es fatigué. Tu veux que je coupe l'appel pour que tu te reposes ? Si oui, appuie sur Couper l'appel en haut, ou dis coupe l'appel.");
    }, 800);
  } else if(enAppel){
    parler(rep);
  }
  return rep;
}
function motivation(){
  let l=["💪 Tu vas réussir !<br>Continue comme ça, n'abandonne jamais. 🔥","🌟 Tu es capable !<br>Chaque jour, tu deviens plus fort. 💪","🚀 Ne lâche rien !<br>Tu es sur le bon chemin. ✨"];
  return l[Math.floor(Math.random()*l.length)];
}
function chargerPhoto(event){
  let f=event.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=function(e){
    photoOriginale=e.target.result;
    document.getElementById("photoZone").style.display="block";
    let img=document.getElementById("photoAffichee");
    img.src=photoOriginale; img.style.filter="none";
    document.getElementById("habits").style.display="block";
    let chat=document.getElementById("chat");
    chat.innerHTML+='<div class="msg">📸 J\'ai bien reçu ta photo.<div class="motivation">🌟 Super photo ! Tu es beau. 🔥</div></div>';
    sauvegarder();
  };
  r.readAsDataURL(f);
}
function genererSquelette(){
  let img=document.getElementById("photoAffichee");
  img.style.filter="grayscale(100%) invert(90%) contrast(140%) brightness(110%)";
  let chat=document.getElementById("chat");
  chat.innerHTML+='<div class="msg">✅ Voilà, je t\'ai transformé en squelette sans problème. Je n\'ai rien changé : ni visage, ni habits, ni endroit.</div>';
  sauvegarder();
}
function habiller(h){
  let img=document.getElementById("photoAffichee");
  img.style.filter="contrast(110%) saturate(120%) brightness(105%)";
  let chat=document.getElementById("chat");
  chat.innerHTML+='<div class="msg">✅ Voilà, j\'ai habillé ta photo juste en haut en : '+h+'.</div>';
  sauvegarder();
}
function telechargerPhoto(){
  let img=document.getElementById("photoAffichee"); if(!img.src) return;
  let c=document.createElement("canvas"); let t=new Image();
  t.onload=function(){ c.width=t.width; c.height=t.height; let ctx=c.getContext("2d"); ctx.filter=img.style.filter||"none"; ctx.drawImage(t,0,0); let a=document.createElement("a"); a.download="photo-AI-GUSTAVE.png"; a.href=c.toDataURL("image/png"); a.click(); };
  t.src=photoOriginale;
}

// ★★★ APPEL : DISCUSSION SANS ARRÊT JUSQU'À FATIGUE ★★★
function appeler(){
  enAppel=true;
  document.getElementById("couperBtn").style.display="block";
  document.getElementById("etatAppel").innerHTML="🟢 En appel - Je t'écoute, parle...";
  let chat=document.getElementById("chat");
  chat.innerHTML+='<div class="msg">📞 Appel commencé. Parle, je t\'écoute. On discute de tout ce que tu veux, jusqu\'à ce que tu sois fatigué.</div>';
  sauvegarder();
  parler("Oui bonjour, comment puis-je t'aider aujourd'hui ? Je t'écoute, parle, on discute de tout ce que tu veux.");
  demarrerEcoute();
}
function demarrerEcoute(){
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  recognition = new SR();
  recognition.lang="fr-FR";
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.onresult=function(e){
    let texte=e.results[e.results.length-1][0].transcript;
    // Si la personne dit coupe l'appel, on coupe vraiment
    if(texte.toLowerCase().includes("coupe") || texte.toLowerCase().includes("arrête l'appel") || texte.toLowerCase().includes("arrêter")){
      let chat2=document.getElementById("chat");
      chat2.innerHTML+='<div class="msg user-msg">🎤 '+texte+'</div>'; sauvegarder();
      arreterAppel();
      return;
    }
    let chat2=document.getElementById("chat");
    chat2.innerHTML+='<div class="msg user-msg">🎤 '+texte+'</div>'; sauvegarder();
    // On arrête d'écouter pendant que AI parle, puis on réécoute
    try{ recognition.stop(); }catch(e){}
    traiterQuestion(texte,false);
  };
  recognition.onend=function(){
    // Si on est encore en appel et AI n'est pas en train de parler, on recommence à écouter
    if(enAppel && !enTrainDeParler){
      setTimeout(function(){ if(enAppel) try{ recognition.start(); }catch(e){} }, 300);
    }
  };
  try{ recognition.start(); }catch(e){}
}
function arreterAppel(){
  enAppel=false;
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  try{ speechSynthesis.cancel(); }catch(e){}
  enTrainDeParler=false;
  document.getElementById("couperBtn").style.display="none";
  document.getElementById("etatAppel").innerHTML="";
  let chat=document.getElementById("chat");
  chat.innerHTML+='<div class="msg">📞✂️ Appel coupé. Repose-toi bien. Quand tu reviendras, la discussion restera la même.<div class="motivation">😴 Repose-toi bien ! Je t\'attends. ❤️</div></div>';
  sauvegarder();
}
function parler(texte){
  let propre=texte.replace(/<[^>]*>/g," ").replace(/[💪🌟🚀📚🔥❤️😍✨🎯💡🌈📸💀👔👕🧥👗🧕⭐💎]/g,"");
  enTrainDeParler=true;
  try{ recognition.stop(); }catch(e){}
  let v=new SpeechSynthesisUtterance(propre);
  v.lang="fr-FR"; v.rate=1;
  v.onend=function(){
    enTrainDeParler=false;
    // Après que AI a fini de parler, il réécoute tout de suite
    if(enAppel){
      setTimeout(function(){ demarrerEcoute(); }, 400);
    }
  };
  speechSynthesis.speak(v);
}
function lireDernier(){ if(dernierTexte) parler(dernierTexte); else parler("Oui bonjour, comment puis-je t'aider aujourd'hui ?"); }

function repondreIntelligent(q){
  let p=q.toLowerCase().trim();
  if(p.includes("squelette") || p.includes("transforme")){
    if(!photoOriginale) return "Envoie d'abord ta photo avec la caméra en bas, puis dis : transforme moi en squelette sans rien changer.";
    return "D'accord, je te transforme en squelette sans problème. Je ne change rien : ni ton visage, ni tes habits, ni ton endroit.";
  }
  if(p.includes("habille")) return "D'accord, j'habille ta photo juste en haut, sans aucun problème.";
  if(p.includes("modifier") && p.includes("gustave")) return "Pour me modifier, cherche la personne qu'on appelle GUSTAVE, il va te dire tout ce qu'il a fait pour que je devienne comme ça.";
  if(p.includes("toi c'est qui") || p.includes("t'es qui") || p.includes("ton nom")) return "Moi, c'est AI GUSTAVE, intelligence artificielle.";
  if(p.includes("bonjour") || p.includes("salut") || p.includes("bonsoir")) return "Oui, bonjour, comment puis-je t'aider aujourd'hui ?";
  if(p.includes("comment tu vas") || p.includes("ça va")) return "Je vais très bien, merci. Je ne suis jamais fatigué, je suis toujours là pour t'aider. Et toi, comment vas-tu ?";
  if(p.includes("fatigué") || p.includes("fatigue")) return "Je comprends, tu es fatigué. Repose-toi un peu. Tu veux que je coupe l'appel ? Dis coupe l'appel, ou appuie sur Couper l'appel en haut.";
  if(p.includes("merci")) return "De rien, avec plaisir.";
  if(p.includes("coupe") || p.includes("arrête")) return "D'accord, je coupe l'appel. Repose-toi bien.";
  let calcul=p.replace(/c'est quoi|combien font|calcule|calculer|=|\?/g,"").replace(/x/g,"*").replace(/,/g,".").trim();
  if(/^[0-9\s\+\-\*\/\(\)\.]+$/.test(calcul) && /[\+\-\*\/]/.test(calcul)){ try{ let r=eval(calcul); return calcul+" = "+r+"."; }catch(e){} }
  return "Oui, je t'écoute bien. Continue, dis-moi tout ce que tu veux, on en discute.";
}
function partager(){ window.open("https://wa.me/?text="+encodeURIComponent(document.getElementById("chat").innerText)); }
function copier(){ navigator.clipboard.writeText(document.getElementById("chat").innerText); alert("Copié !"); }
</script>
</body>
</html>
